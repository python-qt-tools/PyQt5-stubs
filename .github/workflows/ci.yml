name: CI

on:
  push:
    branches:
      - master
      - run-ci-on-windows
    tags:
      - v*
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os.name }} ${{ matrix.python.name }}
    runs-on: ${{ matrix.os.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runs-on: ubuntu-24.04
            tox: linux
          - name: macOS
            runs-on: macos-15-intel
            tox: macos
          - name: Windows
            runs-on: windows-latest
            tox: windows
        python:
          - name: CPython 3.11
            tox: py311
            action: '3.11'
          - name: CPython 3.12
            tox: py312
            action: '3.12'
          - name: CPython 3.13
            tox: py313
            action: '3.13'
          - name: CPython 3.14
            tox: py314
            action: '3.14'
          - name: CPython 3.15
            tox: py315
            action: '3.15'
    steps:
      - uses: actions/checkout@v3
      - name: Set up ${{ matrix.python.name }}
        uses: actions/setup-python@v4
        with:
          python-version: '${{ matrix.python.action }}.0-alpha - ${{ matrix.python.action }}.X'
          architecture: x64
      - uses: twisted/python-info-action@v1.0.1
      - name: Install Linux Qt5 dependencies
        if: matrix.os.name == 'Linux'
        run: |
          sudo apt-get update --yes
          # Required to stubtest QtMultimedia
          sudo apt-get install --yes libpulse-mainloop-glib0
          sudo apt-get install --yes libgl1 libgl1-mesa-dev xvfb x11-utils libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          pip install tox
      - name: Test
        run: |
          tox -v -e ${{ matrix.python.tox }}-${{ matrix.os.tox }}

  all:
    name: All
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: This
        shell: python
        run: |
          import this
